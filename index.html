<!doctype html>
<html>
  <head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="container-grafico">
      <div class="temp-real-container-header">
        <div class="temp-real-header-top">
          <div class="temp-real-container-row">
            <h1 class="temp-real-titulo">
              Temperatura real × Faixa ideal — Lote 101-A (IPA)
            </h1>
            <div class="temp-real-badge-aovivo">
              <span class="temp-real-badge-aovivo-circulo"></span>Ao vivo
            </div>
          </div>

          <div class="temp-real-legenda">
            <span class="temp-real-legenda-item">
              <span class="temp-real-legenda-linha"></span>Temperatura real
            </span>

            <span class="temp-real-legenda-item">
              <span class="temp-real-legenda-faixa"></span>Faixa ideal 15–24°C
            </span>
          </div>
        </div>

        <p class="temp-real-descricao">
          Leitura a cada 2 segundos · janela dos últimos 20 segundos (tanque
          TQ-01)
        </p>
      </div>

      <div class="temp-real-grafico-wrapper">
        <canvas id="sensorAnalogico"></canvas>
      </div>
    </div>

    <script>
      var sensorAnalogico = new Chart(
        document.getElementById("sensorAnalogico").getContext("2d"),
        {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                type: "line",
                label: "Temperatura real",
                data: [],
                borderColor: "#426084",
                borderWidth: 2,
                pointBackgroundColor: "#426084",
                pointBorderColor: "#426084",
                pointRadius: 4,
                fill: false,
                tension: 0.1,
              },
              {
                type: "line",
                label: "Faixa ideal",
                data: [],
                backgroundColor: "#e8efe6",
                borderWidth: 0,
                pointRadius: 0,
                fill: "+1",
              },
              {
                type: "line",
                data: [],
                borderWidth: 0,
                pointRadius: 0,
                fill: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
              padding: { top: 25, right: 20 },
            },
            scales: {
              y: {
                min: 12,
                max: 28,
              },
            },
            plugins: {
              legend: { display: false },
            },
          },
        },
      );

      var paginacao = {};
      var tempo = {};

      function obterDados(grafico, endpoint) {
        fetch("http://localhost:3300/sensores/" + endpoint)
          .then((response) => response.json())
          .then((valores) => {
            if (paginacao[endpoint] == null) {
              paginacao[endpoint] = 0;
            }
            if (tempo[endpoint] == null) {
              tempo[endpoint] = 0;
            }

            var ultimaPaginacao = paginacao[endpoint];
            paginacao[endpoint] = valores.length;
            valores = valores.slice(ultimaPaginacao);

            valores.forEach((valor) => {
              if (
                grafico.data.labels.length == 10 &&
                grafico.data.datasets[0].data.length == 10
              ) {
                grafico.data.labels.shift();
                grafico.data.datasets[2].data.shift();
                grafico.data.datasets[1].data.shift();
                grafico.data.datasets[0].data.shift();
              }

              grafico.data.labels.push(tempo[endpoint]++);

              grafico.data.datasets[0].data.push(parseFloat(valor.temperatura));
              grafico.data.datasets[1].data.push(parseInt(valor.faixaIdealMax));
              grafico.data.datasets[2].data.push(parseInt(valor.faixaIdealMin));
              grafico.update("none");
            });
          })
          .catch((error) => console.error("Erro ao obter dados:", error));
      }

      setInterval(() => {
        obterDados(sensorAnalogico, "temperatura");
      }, 1000);
    </script>
  </body>
</html>
